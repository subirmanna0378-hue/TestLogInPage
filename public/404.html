<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const repository = '/TestLogInPage'
      const route = window.location.pathname.startsWith(repository)
        ? window.location.pathname.slice(repository.length)
        : window.location.pathname
      window.location.replace(`${repository}/#${route || '/'}${window.location.search}`)
    </script>
  </head>
  <body></body>
</html>
